<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Charada</title>
    <link rel="stylesheet" href="estilo/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <nav>
      <button id="btnHow" onclick="abrirComoJogar()">Como jogar?</button>
      <div id="modal" class="modal hidden">
        <div class="modal-content">
          <button id="fecharModal" onclick="fecharComoJogar()" class="fechar">
            &times;
          </button>
          <h2>Como jogar?</h2>
          <h5>- Digite a resposta da advinha no campo ao lado</h5>
          <h5>- A cada dia uma nova adivinha será gerada</h5>
          <h5>- Dicas aparecem conforme a dificuldade da charada</h5>
        </div>
      </div>
    </nav>
    <main>
      <div class="game">
        <div class="box">
          <h2 id="titulo"></h2>
          <h4 id="questao"></h4>
        </div>
        <div id="block">
          <div id="tent">
            <h6 id="tentativas"></h6>
          </div>
          <div>
            <input type="text" name="resposta" autocomplete="off" />
            <div class="boxbutton">
              <button id="btn" onclick="iniciar()">click</button>
            </div>
          </div>
        </div>

        <div>
          <h5 id="tituloDica"></h5>
          <p id="dica"></p>
          <p id="dica2"></p>
          <p id="dica3"></p>
        </div>
        <p id="errou"></p>
        <p id="acertou"></p>
        <p id="erro"></p>
      </div>
    </main>
    <noscript>
      Você precisa habilitar o javascript para utilizar este APP
    </noscript>
    <script src="javascript/script.js"></script>
  </body>
</html>
