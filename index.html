<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Charada</title>
    <link rel="stylesheet" href="style/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header id="header">
      <div>
        <h1 id="jogonome">Charada</h1>
      </div>
      <nav >
        <button id="btnHow" onclick="abrirComoJogar()">?</button>
        <div id="modal" class="modal hidden">
          <div class="modal-content">
            <button id="fecharModal" onclick="fecharComoJogar()" class="fechar">
              &times;
            </button>
            <h2 class="comojogartitulo">Como jogar?</h2>
            <h5 class="cjcampos">
              - Digite a resposta da advinha no campo ao lado
            </h5>
            <h5 class="cjcampos">- A cada dia uma nova adivinha será gerada</h5>
            <h5 class="cjcampos">
              - Dicas aparecem conforme a dificuldade da charada
            </h5>
          </div>
        </div>
      </nav>
      
    </header>

    <main>
      <div class="game">
        <div class="box">
          <div id="temporizadorcaixa"><span id="temporizador">180 s</span></div>
          <h2 id="titulo"></h2>
          <h4 id="questao"></h4>
        </div>
        <div id="block">
          <div id="tent">
            <h6 id="tentativas">
              Tentativas: <span id="numerotentativas"></span>
            </h6>
          </div>
          <div>
            <input type="text" name="resposta" autocomplete="off" />
            <div class="boxbutton">
              <button id="btn" onclick="iniciar()">click</button>
            </div>
          </div>
        </div>

        <div>
          <h5 id="tituloDica"></h5>
          <p id="dica"></p>
          <p id="dica2"></p>
          <p id="dica3"></p>
        </div>
        <p id="errou"></p>
        <p id="acertou"></p>
        <p id="erro"></p>
      </div>
    </main>
    <noscript>
      Você precisa habilitar o javascript para utilizar este APP
    </noscript>
    <script src="javascript/script.js"></script>
  </body>
</html>
